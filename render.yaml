# WonderTask — Render blueprint (same pattern as wunderdog-dashboard).
# autoDeploy: every push to the connected branch on GitHub deploys automatically.
# Scheduled jobs deliberately do NOT live here — they run as GitHub Actions
# (.github/workflows/wondertask-*.yml) so all crons stay on GitHub.
services:
  - type: web
    name: wondertask
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: wondertask
    buildCommand: pip install -r requirements.txt
    # Single sync worker on purpose (same as the dashboard): one request at a time,
    # no cross-request state leakage. Scale with more instances, not threads.
    startCommand: gunicorn --chdir app server:app
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SUPABASE_URL            # set in Render dashboard (same Supabase project or a new one)
        sync: false
      - key: SUPABASE_SERVICE_KEY    # secret — set in Render dashboard
        sync: false
      - key: SECRET_KEY              # Flask session key — set once in Render dashboard
        sync: false
      - key: ANTHROPIC_API_KEY       # Claude extraction from the in-app "Analyze now" box
        sync: false
      - key: FIREFLIES_API_KEY       # enables the in-app "Sync Fireflies now" button
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL   # first-boot admin account (safe to remove afterwards)
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # --- optional: Teams sync + reminder emails (same MS app registration as the dashboard) ---
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: TEAMS_TEAM_ID
        sync: false
      - key: TEAMS_CHANNEL_ID
        sync: false
      - key: MAIL_SENDER
        sync: false
