# WonderTask — Fireflies → tasks. Runs on GitHub (not locally, not on Render):
# pulls new meeting transcripts, Claude extracts action items, matches existing tasks
# first, auto-allocates by role skills (pending acceptance) or parks in the pool.
name: WonderTask Fireflies sync
on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC = 09:00 UAE, after morning meetings are transcribed
    - cron: "0 13 * * *"    # 13:00 UTC = 17:00 UAE, catches afternoon meetings
  workflow_dispatch: {}     # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r wondertask/requirements.txt
      - name: Sync Fireflies transcripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
        run: python wondertask/sync_fireflies.py
